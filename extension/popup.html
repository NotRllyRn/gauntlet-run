<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gauntlet Run</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body class="popup">
    <main>
      <a
        id="update-link"
        class="update-notice"
        target="_blank"
        rel="noopener noreferrer"
        hidden
        >⬆ Update extension</a
      >
      <h2 id="run-title">Gauntlet Run</h2>
      <p id="elapsed"></p>
      <p id="score" aria-live="polite"></p>
      <div class="actions">
        <button id="copy" disabled>Copy gauntlet run results</button>
        <button id="copy-image" class="secondary" disabled>
          Copy gauntlet image run results
        </button>
      </div>
      <p id="copy-status" role="status"></p>
      <div class="actions">
        <button id="start">Start run</button><button id="next">Next game</button
        ><button id="pause">Pause</button>
      </div>
      <p id="error" role="status"></p>
      <div id="game-list"></div>
      <button id="dashboard" class="secondary">
        Lineup, history &amp; sharing
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
