<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gauntlet Run</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body class="popup">
    <main>
      <h2 id="run-title">Gauntlet Run</h2>
      <p id="elapsed"></p>
      <div class="actions">
        <button id="start">Start run</button><button id="next">Next game</button
        ><button id="pause">Pause</button>
      </div>
      <p id="error" role="status"></p>
      <div id="game-list"></div>
      <button id="dashboard" class="secondary">
        Lineup, history &amp; sharing
      </button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
